name: Pruebas y compilación
on:
  push:
    branches: [main, "fix/**"]
  pull_request:
permissions:
  contents: read
concurrency:
  group: qa-${{ github.ref }}
  cancel-in-progress: true
jobs:
  backend:
    runs-on: ubuntu-latest
    services:
      postgres:
        image: postgres:16-alpine
        env:
          POSTGRES_DB: barber_test
          POSTGRES_USER: test
          POSTGRES_PASSWORD: local_test_only
        ports: ["5432:5432"]
        options: --health-cmd "pg_isready -U test -d barber_test" --health-interval 5s --health-timeout 5s --health-retries 10
    env:
      DATABASE_URL: postgresql+asyncpg://test:local_test_only@localhost:5432/barber_test
      TEST_POSTGRES_URL: postgresql+asyncpg://test:local_test_only@localhost:5432/barber_test
      DATABASE_SSL: disable
      ENVIRONMENT: production
      CALENDAR_ENABLED: "false"
      REMINDERS_ENABLED: "false"
    defaults:
      run:
        working-directory: backend
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"
          cache: pip
          cache-dependency-path: backend/requirements*.txt
      - run: pip install -r requirements-test.txt
      - run: alembic upgrade head
      - run: alembic upgrade head
      - run: python -m unittest discover -s tests -v
      - run: python -c "from app.main import app; from app.tasks.reminder_cron import start_cron; print(app.version)"
  frontend:
    runs-on: ubuntu-latest
    defaults:
      run:
        working-directory: frontend
    env:
      VITE_API_URL: https://api.example.com
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: "22"
          cache: npm
          cache-dependency-path: frontend/package-lock.json
      - run: npm ci
      - run: npm test
      - run: npm run build
      - run: npm audit --omit=dev --audit-level=high
