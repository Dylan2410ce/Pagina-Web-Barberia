services:
  - type: web
    name: sebas-barber-api
    env: python
    rootDir: backend
    buildCommand: pip install -r requirements.txt
    startCommand: uvicorn app.main:app --host 0.0.0.0 --port $PORT
    healthCheckPath: /health
    envVars:
      - key: PYTHON_VERSION
        value: 3.12.11
      - key: DATABASE_URL
        sync: false
      - key: DATABASE_SSL
        value: require
      - key: SECRET_KEY
        generateValue: true
      - key: FRONTEND_URL
        value: https://sebasbarber.vercel.app
      - key: ADMIN_DEFAULT_PASSWORD
        sync: false
      - key: GABRIEL_DEFAULT_PASSWORD
        sync: false
      - key: MASTER_RESET_CODE
        sync: false
      - key: GOOGLE_CALENDAR_SEBASTIAN_ID
        value: sebasbarberg2021@gmail.com
      - key: GOOGLE_CALENDAR_GABRIEL_ID
        value: ce553e6aad32461bfe8a2e22e9ace248af0810c8e987115572b8db28d227bd7a@group.calendar.google.com
      - key: GOOGLE_CREDENTIALS_JSON
        sync: false
      - key: CALENDAR_ENABLED
        value: "true"
      - key: CALENDAR_REQUIRED
        value: "true"
      - key: APPOINTMENT_BUFFER_MIN
        value: "0"
      - key: SERVICE_CACHE_TTL_SECONDS
        value: "300"
      - key: REMINDERS_ENABLED
        value: "false"
      - key: REMINDER_LEAD_HOURS
        value: "24"
      - key: REMINDER_BATCH_SIZE
        value: "50"
      - key: REMINDER_TASK_TOKEN
        sync: false
